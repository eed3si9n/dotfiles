# set Ctrl-t as the default prefix key combination
# and unbind C-b to free it up
set -g prefix C-t
unbind C-b
# note: `bind C-t select-pane` further down replaces this binding
bind C-t send-prefix

# shell

set-option -g default-shell /bin/zsh
set -g default-command "${SHELL}"

# use UTF8
# set -g utf8
# set-window-option -g utf8 on

# color terminal
# tmux-256color supports italics; fall back where its terminfo is missing
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# true color for Vim inside tmux
set -as terminal-features ",*:RGB"
# pass through Shift+Arrow
set-window-option -g xterm-keys on
# I need the scrollback too
set -g terminal-overrides 'xterm-256color:smcup@:rmcup@'

# Make mouse useful in copy mode
set-option -g mouse on

# Scroll history
set -g history-limit 30000

# vi mode
set-window-option -g mode-keys vi

# refresh
bind C-r source-file ~/.tmux.conf

# window related
bind c new-window
bind Q confirm-before kill-window

bind " " next-window
# bind n next-window
bind BSpace previous-window

# control arrow to switch windows
bind -n C-Left  previous-window
bind -n C-Right next-window

# prefix control arrow to move windows
bind -r C-Left swap-window -t -1
bind -r C-Right swap-window -t +1

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# pane-related
# bind 1 break-pane
bind s split-window -v
bind v split-window -h
bind q confirm-before kill-pane
# bind -n C-w kill-pane
bind C-t select-pane -t :.+

# map vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# use ctrl-shift-arrow keys without prefix key to switch panes
bind -n C-S-Left select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up select-pane -U
bind -n C-S-Down select-pane -D

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# status line (monokai)
# Palette:  bg #26292C  bar #2E323C  panel #333842  text #e3e3e1  grey #8F908A
#           green #a6e22e  aqua #66d9ef  pink #f92672  orange #fd971f

# Separators: flat by default. ~/.tmux.local.conf can switch on arrows.
set -g @sep_r ""
set -g @sep_l ""

set -g status on
set -g status-interval 30
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#b1b1b1,bg=#2E323C"
set -g status-left-length 40
set -g status-right-length 80

# Session name; turns orange while the prefix key is pressed
set -g status-left "#[fg=#26292C,bg=#{?client_prefix,#fd971f,#a6e22e},bold] #S #[fg=#{?client_prefix,#fd971f,#a6e22e},bg=#2E323C,nobold]#{@sep_r} "

# Windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#8F908A] #I #W "
set -g window-status-current-format "#[fg=#2E323C,bg=#66d9ef]#{@sep_r}#[fg=#26292C,bold] #I #W #[fg=#66d9ef,bg=#2E323C,nobold]#{@sep_r}"

# Date/time and hostname
set -g status-right "#[fg=#333842,bg=#2E323C]#{@sep_l}#[fg=#e3e3e1,bg=#333842] %Y-%m-%d %H:%M #[fg=#f92672,bg=#333842]#{@sep_l}#[fg=#26292C,bg=#f92672,bold] #h "

# Panes and messages
set -g pane-border-style "fg=#333842"
set -g pane-active-border-style "fg=#a6e22e"
set -g message-style "fg=#26292C,bg=#e6db74"
set -g mode-style "fg=#26292C,bg=#fd971f"

# per-machine overrides (not committed)
source-file -q $HOME/dotfiles/tmux.local.conf
